<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69d97a"/>
      <stop offset="50%" stop-color="#05c3c6"/>
      <stop offset="100%" stop-color="#e9cc4f"/>
    </linearGradient>

    <!-- Mask to create transparent holes in the nodes -->
    <mask id="holeMask">
      <rect x="0" y="0" width="512" height="512" fill="white"/>
      <!-- Top node hole -->
      <circle cx="184" cy="152" r="22" fill="black"/>
      <!-- Right node hole -->
      <circle cx="344" cy="352" r="22" fill="black"/>
    </mask>

    <!-- Soft drop shadow for the white branch icon -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#006666" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect x="0" y="0" width="512" height="512" rx="120" ry="120" fill="url(#bgGrad)"/>

  <!-- Git Branch Icon -->
  <g mask="url(#holeMask)" filter="url(#softShadow)">
    <!-- Main vertical branch -->
    <line x1="184" y1="152" x2="184" y2="384" stroke="white" stroke-width="40" stroke-linecap="round"/>
    
    <!-- Merging branch -->
    <line x1="184" y1="240" x2="344" y2="352" stroke="white" stroke-width="40" stroke-linecap="round"/>
    
    <!-- Nodes (Outer rings) -->
    <circle cx="184" cy="152" r="48" fill="white"/>
    <circle cx="344" cy="352" r="48" fill="white"/>
  </g>
</svg>